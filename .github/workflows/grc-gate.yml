name: grc-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform

jobs:
  grc-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Install Conftest
        run: |
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.50.0/conftest_0.50.0_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin conftest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.2.4

      - name: Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > plan.json

      - name: Policy check (Conftest)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -o pipefail
          mkdir -p ../evidence
          conftest test plan.json --policy ../policies --all-namespaces --output json \
            | tee ../evidence/conftest-results.json || exit 1

      - name: Validate control map
        run: python3 scripts/validate_control_map.py

      - name: Apply on merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Collect live evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/collect_evidence.py --terraform-dir terraform --output evidence/live-state.json

      - name: Sign
        if: success()
        run: |
          mkdir -p evidence
          cp terraform/plan.json evidence/plan.json
          tar czf evidence-${{ github.run_id }}.tar.gz evidence
          cosign sign-blob --yes --bundle evidence-${{ github.run_id }}.sig.bundle evidence-${{ github.run_id }}.tar.gz

      - name: Upload to vault
        if: success() && vars.EVIDENCE_VAULT != ''
        env:
          VAULT: ${{ vars.EVIDENCE_VAULT }}
        run: |
          aws s3 cp evidence-${{ github.run_id }}.tar.gz "s3://${VAULT}/runs/${{ github.run_id }}/"
          aws s3 cp evidence-${{ github.run_id }}.sig.bundle "s3://${VAULT}/runs/${{ github.run_id }}/"
